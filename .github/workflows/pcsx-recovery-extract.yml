name: Build PCSX-Redux recovery artifact

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pcsx-recovery-extract.yml'

permissions:
  contents: read

env:
  PCSX_REDUX_REF: '2a36099dc24c5a746854e3de8359c40e5af21c10'

jobs:
  build-pcsx:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Build pinned PCSX-Redux AppImage
        run: |
          set -euxo pipefail
          rm -rf tools/build/pcsx-redux-src
          git clone --recursive https://github.com/grumpycoders/pcsx-redux.git tools/build/pcsx-redux-src
          git -C tools/build/pcsx-redux-src checkout "$PCSX_REDUX_REF"
          git -C tools/build/pcsx-redux-src submodule update --init --recursive
          (
            cd tools/build/pcsx-redux-src
            ./dockermake.sh appimage
          )
          APPIMAGE="$(find tools/build/pcsx-redux-src -maxdepth 2 -type f -name 'PCSX-Redux-*-x86_64.AppImage' | head -1)"
          test -n "$APPIMAGE"
          mkdir -p tools/installed/pcsx-redux
          cp "$APPIMAGE" tools/installed/pcsx-redux/PCSX-Redux.AppImage
          chmod +x tools/installed/pcsx-redux/PCSX-Redux.AppImage
          (
            cd tools/installed/pcsx-redux
            ./PCSX-Redux.AppImage --appimage-extract >/dev/null
          )
          test -x tools/installed/pcsx-redux/squashfs-root/AppRun
          printf 'source_ref=%s\n' "$PCSX_REDUX_REF" > tools/installed/pcsx-redux/RECOVERY_SOURCE.txt

      - name: Package PCSX-Redux recovery bundle
        run: |
          set -euxo pipefail
          mkdir -p recovery/out
          tar -C . -czf recovery/out/ContinueRetro-PS1-pcsx-redux-2a36099dc-linux-x86_64.tar.gz tools/installed/pcsx-redux
          sha256sum recovery/out/ContinueRetro-PS1-pcsx-redux-2a36099dc-linux-x86_64.tar.gz > recovery/out/PCSX_RECOVERY_SHA256.txt
          printf 'repo_commit=%s\nsource_ref=%s\n' "$GITHUB_SHA" "$PCSX_REDUX_REF" > recovery/out/PCSX_RECOVERY_SOURCE.txt
          cat recovery/out/PCSX_RECOVERY_SHA256.txt

      - name: Upload PCSX-Redux recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: ContinueRetro-PS1-pcsx-redux-2a36099dc-linux-x86_64
          path: recovery/out/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
