name: Studio quality and source recovery (no game validation)

on:
  push:
    branches: ['studio/london-quality-checkpoint-20260908']
    paths:
      - 'studio_next/**'
      - '.github/workflows/studio-quality-validation.yml'
  pull_request:
    paths:
      - 'studio_next/**'
      - '.github/workflows/studio-quality-validation.yml'

permissions:
  contents: read

concurrency:
  group: studio-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Fetch exact source-only commit
        env:
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git init work
          git -C work remote add origin "$REPOSITORY_URL"
          git -C work fetch --depth=1 origin "$COMMIT_SHA"
          git -C work checkout --detach FETCH_HEAD
          test "$(git -C work rev-parse HEAD)" = "$COMMIT_SHA"
      - name: Reject private assets in tracked staging sources
        shell: bash
        run: |
          set -euo pipefail
          cd work
          test -z "$(git ls-files studio_next | grep -Ei '\.(bin|cue|iso|rom|ttf|otf|bdf|pcf|fnt|fon|woff2?|gguf|safetensors|sqlite3?|db|har)$' || true)"
      - name: Compile code and validate launcher syntax
        shell: bash
        run: |
          set -euo pipefail
          cd work
          python3 --version
          python3 -m compileall -q studio_next
          bash -n studio_next/PREPARE_STUDIO_SOURCE.command
      - name: Run existing policy tests and source-bridge fixture tests
        shell: bash
        run: |
          set -euo pipefail
          cd work
          python3 -m unittest discover -s studio_next -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/studio-validation.txt"
      - name: Package the tested helper only
        shell: bash
        run: |
          set -euo pipefail
          cd work
          python3 studio_next/package_source_bridge.py --output-directory dist --validation-log "$RUNNER_TEMP/studio-validation.txt"
          python3 - <<'PY'
          from pathlib import Path
          import tempfile, zipfile, subprocess, sys
          with tempfile.TemporaryDirectory(prefix='verify-helper-') as directory:
              with zipfile.ZipFile('dist/ContinueRetro_Source_Bridge_v1.zip') as archive:
                  archive.extractall(directory)
              package = Path(directory) / 'ContinueRetro_Source_Bridge_v1'
              subprocess.run([sys.executable, '-m', 'unittest', 'test_source_bridge.py', '-v'], cwd=package, check=True)
          print('PACKAGED_HELPER_FIXTURE_TESTS_PASS')
          PY
      - name: Upload helper ZIP and checksum (no app/private data)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ContinueRetro-source-bridge-${{ github.sha }}
          path: |
            work/dist/ContinueRetro_Source_Bridge_v1.zip
            work/dist/ContinueRetro_Source_Bridge_v1.zip.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Record validation boundary
        if: always()
        shell: bash
        run: |
          printf '%s\n' 'Tests cover isolated quality policies, review input, and authored source-transfer ZIP fixtures. They do NOT inspect the actual v0.6.0 app archive, install Studio, validate London, run Ollama, test the Mac Finder dialog, or train a model.' >> "$GITHUB_STEP_SUMMARY"
