name: Build portable toolchain recovery bundle

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/toolchain-recovery.yml'

permissions:
  contents: read

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git cmake ninja-build unzip openjdk-21-jre-headless python3 curl ffmpeg imagemagick \
            clang lld llvm build-essential pkg-config \
            libcapstone-dev libfreetype-dev libavcodec-dev libavformat-dev libavutil-dev \
            libcurl4-openssl-dev libglfw3-dev libswresample-dev libuv1-dev zlib1g-dev

      - name: Restore locked portable tools
        env:
          CR_SKIP_SYSTEM_DEPS: '1'
        run: |
          set -euxo pipefail
          ./scripts/bootstrap.sh

      - name: Build pinned PCSX-Redux AppImage
        run: |
          set -euxo pipefail
          if [ ! -x tools/installed/pcsx-redux/squashfs-root/AppRun ]; then
            rm -rf tools/build/pcsx-redux-src
            git clone --recursive https://github.com/grumpycoders/pcsx-redux.git tools/build/pcsx-redux-src
            git -C tools/build/pcsx-redux-src checkout 2a36099dc24c5a746854e3de8359c40e5af21c10
            git -C tools/build/pcsx-redux-src submodule update --init --recursive
            (
              cd tools/build/pcsx-redux-src
              ./dockermake.sh appimage
            )
            APPIMAGE="$(find tools/build/pcsx-redux-src -maxdepth 2 -type f -name 'PCSX-Redux-*-x86_64.AppImage' | head -1)"
            test -n "$APPIMAGE"
            mkdir -p tools/installed/pcsx-redux
            cp "$APPIMAGE" tools/installed/pcsx-redux/PCSX-Redux.AppImage
            chmod +x tools/installed/pcsx-redux/PCSX-Redux.AppImage
            (
              cd tools/installed/pcsx-redux
              ./PCSX-Redux.AppImage --appimage-extract >/dev/null
            )
          fi
          test -x tools/installed/pcsx-redux/squashfs-root/AppRun
          printf '%s\n' 'source_ref=2a36099dc24c5a746854e3de8359c40e5af21c10' > tools/installed/pcsx-redux/RECOVERY_SOURCE.txt

      - name: Record recovery manifest
        run: |
          set -euxo pipefail
          mkdir -p recovery
          {
            echo 'ContinueRetro-PS1 portable toolchain recovery bundle'
            echo 'platform=linux-x86_64'
            echo "repo_commit=${GITHUB_SHA}"
            echo 'pcsx_redux_source_ref=2a36099dc24c5a746854e3de8359c40e5af21c10'
            echo
            echo '[installed top-level]'
            find tools/installed -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort
            echo
            echo '[locked cache hashes present]'
            find tools/cache -maxdepth 1 -type f -print0 | sort -z | xargs -0 -r sha256sum
          } > recovery/RECOVERY_MANIFEST.txt
          tar -C . -czf recovery/ContinueRetro-PS1-toolchain-linux-x86_64.tar.gz tools/installed recovery/RECOVERY_MANIFEST.txt
          sha256sum recovery/ContinueRetro-PS1-toolchain-linux-x86_64.tar.gz > recovery/RECOVERY_SHA256.txt
          cat recovery/RECOVERY_SHA256.txt

      - name: Upload portable recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: ContinueRetro-PS1-toolchain-linux-x86_64
          path: |
            recovery/ContinueRetro-PS1-toolchain-linux-x86_64.tar.gz
            recovery/RECOVERY_SHA256.txt
            recovery/RECOVERY_MANIFEST.txt
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
